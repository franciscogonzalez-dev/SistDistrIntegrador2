%% ====================================================================
%% broker/emqx/acl.conf
%% Reglas de control de acceso (ACL) para EMQX 5.8 CREO XD
%% Contrato definido en docs/acl.md y docs/topics.md
%% ====================================================================

%% 1. servicio central: verdad oficial del sistema y consumo de entradas

{allow, {username, "servicio"}, publish, [
    "flota/#",
    "emergencias/#",
    "alertas/#",
    "respuestas/#",
    "usuarios/#",
    "servicio/estado"
]}.

{allow, {username, "servicio"}, subscribe, [
    "reportes/+/+/posicion",
    "reportes/+/+/presencia",
    "comandos/+/+/+",
    "pedidos/+/+"
]}.

%% 2. unidades móviles: prefijo del usuario fija la fuerza permitida

%% ambulancias: solo publican bajo reportes/ambulancia/${username}/...
{allow, {username, {re, "^amb-"}}, publish, [
    "reportes/ambulancia/${username}/#"
]}.

%% policías: solo publican bajo reportes/policia/${username}/...
{allow, {username, {re, "^pol-"}}, publish, [
    "reportes/policia/${username}/#"
]}.

%% bomberos: solo publican bajo reportes/bomberos/${username}/...
{allow, {username, {re, "^bom-"}}, publish, [
    "reportes/bomberos/${username}/#"
]}.

%% 3. despachador: emite comandos propios y monitorea la flota y emergencias

{allow, {username, {re, "^desp-"}}, publish, [
    "comandos/${username}/#"
]}.

{allow, {username, {re, "^desp-"}}, subscribe, [
    "flota/#",
    "emergencias/#",
    "alertas/#",
    "usuarios/${username}/#",
    "respuestas/${username}",
    "servicio/estado"
]}.

%% 4. público (civiles): solo solicita emergencias con su ${clientid}
{allow, {username, "publico"}, publish, [
    "pedidos/${clientid}/#"
]}.

{allow, {username, "publico"}, subscribe, [
    "usuarios/${clientid}/#",
    "servicio/estado"
]}.

%% 5. denegación explícita por defecto (principio de menor privilegio)
{deny, all}.
