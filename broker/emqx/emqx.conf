## ====================================================================
## broker/emqx/emqx.conf
## Configuración versionada para EMQX
## Requerimiento 5 (Seguridad): Autenticación y Autorización
## ====================================================================

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

## --------------------------------------------------------------------
## CADENA DE AUTENTICACIÓN (authentication)
## --------------------------------------------------------------------
authentication = [
  # Eslabón 1: Autenticador cinfo (Client-Info)
  # Ata el Client ID al usuario según el contrato de docs/acl.md (Duda 16)
  {
    mechanism = cinfo
    enable = true
    checks = [
      # Rechazar conexiones anónimas de inmediato
      {
        is_match = "is_empty_val(username)"
        result = deny
      },
      # Usuario 'publico': client ID forzado al formato 'publico-<32 hex>'
      {
        is_match = [
          """str_eq(username, "publico")""",
          """not(regex_match(clientid, "^publico-[0-9a-fA-F]{32}$"))"""
        ]
        result = deny
      },
      # Todos los demás usuarios: client ID estrictamente idéntico al username
      {
        is_match = [
          """str_neq(username, "publico")""",
          "str_neq(clientid, username)"
        ]
        result = deny
      }
      # Si se superan estas validaciones, continúa al siguiente eslabón (base interna)
    ]
  },

  # Eslabón 2: Base interna (Mnesia) cargada desde archivo CSV
  # Valida la contraseña real contra /opt/emqx/etc/usuarios.csv
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
    user_id_type = username
    bootstrap_file = "/opt/emqx/etc/usuarios.csv"
    bootstrap_type = plain
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

## --------------------------------------------------------------------
## CONTROL DE ACCESO (authorization / ACL)
## --------------------------------------------------------------------
authorization {
  # Principio de menor privilegio: cualquier intento no contemplado se deniega
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

# WEBHOOKS DIRECTO (receptor conexion/desconexion de clientes) e INDIRECTO (receptor recibe logg denegacion del acl al publicar )
## Los headers, con el secreto, llegan por EMQX_CONNECTORS__HTTP__RECEPTOR__HEADERS (compose.yaml)
connectors {
  http {
    receptor {
      url = "http://receptor:5000"
    }
  }
}

actions {
  http {
    conexiones_clientes_WH_D {
      connector = receptor
      parameters { method = post, path = "/avisos/directo" }
    }
    receptor_regla_acl_denegados {
      connector = receptor
      parameters { method = post, path = "/avisos/regla" }
    }
  }
}

rule_engine {
  rules {
    conexiones_clientes_WH_D {
      description = "Avisa cada conexión y desconexión de un cliente"
      actions = ["http:conexiones_clientes_WH_D"]
      sql = """~
        SELECT * FROM "$events/client/connected", "$events/client/disconnected"~"""
    }
    receptor_regla_ACL_pub_denegados {
      description = "Avisa cuando la ACL le niega una publicación a un cliente"
      actions = ["http:receptor_regla_acl_denegados"]
      sql = """~
        SELECT clientid, username, topic, action
        FROM "$events/auth/check_authz_complete"
        WHERE result = 'deny' AND action = 'publish'~"""
    }
  }
}
